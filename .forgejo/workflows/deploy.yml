# Builds a reproducible image on every push to main, pushes it to oci.chax.at
# (a Zot registry, published to via Forgejo OIDC workload identity + buildah/
# skopeo — daemonless, no Docker socket needed), then deploys it to every
# production instance (the Bitbucket Server, Bitbucket Cloud and Forgejo
# pollers), which run side by side on the same host with separate persisted
# data/repos dirs. An instance uses docker-compose.<instance>.yml as an
# override when that file exists.
#
# Adjust `runs-on: docker` below if your runner uses a different label.
name: deploy

on:
  push:
    branches: [main, 'feature/*']

enable-openid-connect: true

concurrency:
  group: deploy-${{ forgejo.repository }}
  cancel-in-progress: ${{ forgejo.ref_name != 'main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }

      - run: npm run ci:lint
      - run: npm run ci:typecheck
      - run: npm run ci:test
      - run: npm run ci:audit
        continue-on-error: true

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Upload SBOM to Dependency Track
        uses: https://github.com/Rosslight/DependencyTrackChecker@v1.3
        id: dtrack
        with:
          server-hostname: https://${{ vars.DEPENDENCYTRACK_HOST }}
          api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          project: ${{ vars.DEPENDENCYTRACK_PROJECT }}
          bom-filename: sbom.json

      - name: Dependency Track Results
        run: |
          cat <<-EOT
          Risk Score: ${{ steps.dtrack.outputs.risk-score }}
          Violations: ${{ steps.dtrack.outputs.violations-total }}
          Vulnerabilities: ${{ steps.dtrack.outputs.vulnerabilities }}
          EOT

  build:
    runs-on: podman
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        uses: actions/oci-build@main
        with:
          annotations: |
            org.opencontainers.image.description=chax-local-git-reviewer
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=chax-local-git-reviewer

      - name: Publish Image
        uses: actions/oci-copy@main
        id: publish
        with:
          tags: |
            build-${{ forgejo.run_number }}
            sha-${{ forgejo.sha }}
            ${{ forgejo.ref_name == 'main' && 'latest' || '' }}

  deploy:
    if: forgejo.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [server, cloud, forge]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        uses: actions/setup-ssh@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          scan-hosts: ${{ vars.DEPLOY_PRODUCTION_HOSTNAME }}

      - name: Sync compose file(s)
        run: |
          remote_dir="${{ vars.DEPLOY_PATH || format('/srv/app/{0}', forgejo.repository) }}/${{ matrix.instance }}"
          files="docker-compose.yml"
          if [ -f "docker-compose.${{ matrix.instance }}.yml" ]; then
            files="$files docker-compose.${{ matrix.instance }}.yml"
          fi
          rsync -az --mkpath $files \
            "${{ vars.DEPLOY_PRODUCTION_USERNAME }}@${{ vars.DEPLOY_PRODUCTION_HOSTNAME }}:$remote_dir/"

      - name: Pull and restart
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ vars.OCI_REGISTRY }}" \
            | sed -E 's/.*"value":"([^"]+)".*/\1/')"
          echo "::add-mask::$TOKEN"
          
          remote_dir="${{ vars.DEPLOY_PATH || format('/srv/app/{0}', forgejo.repository) }}/${{ matrix.instance }}"
          compose_files="-f docker-compose.yml"
          if [ -f "docker-compose.${{ matrix.instance }}.yml" ]; then
            compose_files="$compose_files -f docker-compose.${{ matrix.instance }}.yml"
          fi
          ssh "${{ vars.DEPLOY_PRODUCTION_USERNAME }}@${{ vars.DEPLOY_PRODUCTION_HOSTNAME }}" bash -s <<EOF
            set -euo pipefail
            cd "$remote_dir"
            echo "${TOKEN}" | docker login ${{ vars.OCI_REGISTRY }} -u "oidc" --password-stdin
            image="${{ needs.build.outputs.image }}" docker compose $compose_files up -d \
              --remove-orphans --pull always
            docker logout ${{ vars.OCI_REGISTRY }}
          EOF

  post-deploy:
    needs: [build, deploy]
    # Run even when one instance fails to deploy: the others have already
    # pulled the new image, and the old one still fills the disk.
    if: ${{ !cancelled() && needs.build.result == 'success' && forgejo.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: actions/setup-ssh@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          scan-hosts: ${{ vars.DEPLOY_PRODUCTION_HOSTNAME }}

      # Only this app's images: the host also runs other apps, and a host-wide
      # `docker system prune -af` deletes their stopped containers and unused
      # images too. Every instance has restarted on the new image by now, so
      # all other images of this repository are old; `docker rmi` refuses the
      # ones a container still uses, so those stay. The pi-runner images live
      # inside each instance's dind daemon and are not touched.
      - name: Cleanup
        run: |
          image="${{ needs.build.outputs.image }}"
          repo="${image%@*}"
          repo="${repo%:*}"
          ssh "${{ vars.DEPLOY_PRODUCTION_USERNAME }}@${{ vars.DEPLOY_PRODUCTION_HOSTNAME }}" bash -s <<EOF
            docker image ls --filter "reference=${repo}" -q | sort -u | xargs -r docker rmi 2>/dev/null || true
            docker image prune -f >/dev/null
          EOF
